server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: command-service
              uri: http://command-service:8081
              predicates:
                - Path=/api/incidents/**

            - id: query-service-rest
              uri: http://query-service:8082
              predicates:
                - Path=/api/query/**

            - id: agent-service
              uri: http://agent-service:8083
              predicates:
                - Path=/api/agent/**

management:
  endpoint:
    health:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  tracing:
    sampling:
      probability: 1.0
    opentelemetry:
      tracing:
        export:
          otlp:
            endpoint: http://otel-collector:4318/v1/traces

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-}]"