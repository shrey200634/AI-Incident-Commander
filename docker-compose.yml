services:
  mysql:
    image: mysql:8.0
    container_name: aic-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: aic-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: aic-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: aic-kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  query-service:
    build:
      context: ./Backend/query-service
    container_name: aic-query-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started
      command-service:
        condition: service_healthy
    ports:
      - "18082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  command-service:
    build:
      context: ./Backend/command-service
    container_name: aic-command-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
    ports:
      - "18081:8081"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_COMPOSE_DIR: /workspace
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace
      - ${DJF_PROJECT_DIR}:/djf-workspace:ro

  notification-service:
    build:
      context: ./Backend/notification-service
    container_name: aic-notification-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      command-service:
        condition: service_healthy
    ports:
      - "18084:8084"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ALERT_EMAIL: ${ALERT_EMAIL}

  agent-service:
    build:
      context: ./Backend/agent-service
    container_name: aic-agent-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started
      command-service:
        condition: service_healthy
    ports:
      - "18083:8083"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      COMMAND_SERVICE_URL: http://command-service:8081
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      MONITORED_SERVICES: ${MONITORED_SERVICES}
      ANOMALY_LATENCY_THRESHOLD_MS: ${ANOMALY_LATENCY_THRESHOLD_MS}

  # Internal Prometheus container disabled — AI Incident Commander connects to Digg Project's Prometheus on port 9090
  #  prometheus:
  #    image: prom/prometheus:v2.51.0
  #    container_name: aic-prometheus
  #    restart: unless-stopped
  #    ports:
  #      - "9090:9090"
  #    volumes:
  #      - ./prometheus.yml:/etc/prometheus/prometheus.yml
  #      - ./alerts.yml:/etc/prometheus/alerts.yml
  #    extra_hosts:
  #      - "host.docker.internal:host-gateway"

  api-gateway:
    build:
      context: ./Backend/api-gateway
    container_name: aic-api-gateway
    restart: unless-stopped
    depends_on:
      command-service:
        condition: service_healthy
      query-service:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    ports:
      - "18080:8080"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

  frontend:
    build:
      context: ./Frontend
    container_name: aic-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
      - query-service
      - command-service
    ports:
      - "5174:80"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    container_name: aic-otel-collector
    restart: unless-stopped
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:2.5.0
    container_name: aic-tempo
    restart: unless-stopped
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    image: grafana/loki:3.1.0
    container_name: aic-loki
    restart: unless-stopped
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"

  aic-prometheus:
    image: prom/prometheus:v2.51.0
    container_name: aic-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./aic-prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aic-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - aic-prometheus
      - tempo
      - loki

volumes:
  mysql_data:
  tempo_data:
  loki_data:
  grafana_data: